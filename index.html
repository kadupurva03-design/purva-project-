<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Deadline Desk</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.js"></script>
<style>
:root{--bg:#faf5f3;--surface:#fff;--ink:#2a1517;--muted:#7a5f61;--line:#ead9d6;--red:#b3202e;--red-d:#8a1822;--red-soft:#f8dfe0;--amber:#b86a00;--amber-soft:#fbe9cc;--green:#2f7a4d;--green-soft:#dcf0e3}
@media (prefers-color-scheme:dark){:root{--bg:#1b0f10;--surface:#27171a;--ink:#f6e8e6;--muted:#b99a9a;--line:#40272a;--red:#ee5a67;--red-d:#d94453;--red-soft:#4a1d22;--amber:#f0b04a;--amber-soft:#463014;--green:#6fcf94;--green-soft:#1d3a2a}}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.5 "Segoe UI",system-ui,sans-serif}
h1,h2{font-family:Georgia,"Times New Roman",serif;margin:0}
.wrap{max-width:900px;margin:0 auto;padding:28px 18px 60px}
header{display:flex;justify-content:space-between;align-items:flex-end;gap:12px;margin-bottom:20px}
h1{font-size:2rem}.sub{color:var(--muted);margin:4px 0 0}
.grid{display:grid;grid-template-columns:290px 1fr;gap:20px;align-items:start}
@media(max-width:760px){.grid{grid-template-columns:1fr}}
.panel{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:16px}
.panel h2{font-size:1.2rem;margin-bottom:10px}
label{display:block;font-size:.9rem;color:var(--muted);margin:10px 0 3px}
input,select,button{font:inherit;color:inherit}
input,select{width:100%;padding:9px 10px;border:1px solid var(--line);border-radius:6px;background:var(--bg)}
:focus-visible{outline:2px solid var(--red);outline-offset:2px}
.btn{background:var(--red);color:#fff;border:0;border-radius:6px;padding:10px 14px;cursor:pointer;font-weight:600}
.btn:hover{background:var(--red-d)}.btn.full{width:100%;margin-top:14px}
.btn.ghost{background:transparent;color:var(--red);border:1px solid var(--red)}.btn.small{padding:6px 10px;font-size:.85rem}
#auth{max-width:380px;margin:30px auto}.row{display:flex;gap:8px;margin-top:14px}.row .btn{flex:1}
.msg{color:var(--red);font-size:.9rem;min-height:1.3em;margin:10px 0 0}
.tabs{display:flex;gap:6px;margin-bottom:12px;flex-wrap:wrap}
.tab{background:transparent;border:1px solid var(--line);border-radius:999px;padding:5px 13px;cursor:pointer;color:var(--muted)}
.tab[aria-pressed="true"]{background:var(--red);border-color:var(--red);color:#fff}
.item{display:flex;gap:12px;align-items:flex-start;background:var(--surface);border:1px solid var(--line);border-left:5px solid var(--line);border-radius:8px;padding:12px 14px;margin-bottom:10px}
.item.overdue{border-left-color:var(--red)}.item.soon{border-left-color:var(--amber)}.item.ok{border-left-color:var(--green)}
.item.done{opacity:.6}.item.done .t{text-decoration:line-through}
.item input[type=checkbox]{width:20px;height:20px;margin-top:3px;accent-color:var(--red);flex:none}
.body{flex:1;min-width:0}.t{font-weight:600;overflow-wrap:anywhere}.meta{color:var(--muted);font-size:.9rem}
.badge{display:inline-block;font-size:.8rem;font-weight:600;padding:2px 9px;border-radius:999px;margin-top:4px}
.badge.overdue{background:var(--red-soft);color:var(--red)}.badge.soon{background:var(--amber-soft);color:var(--amber)}
.badge.ok{background:var(--green-soft);color:var(--green)}.badge.done{background:var(--line);color:var(--muted)}
.del{background:none;border:0;color:var(--muted);cursor:pointer;font-size:1.2rem}.del:hover{color:var(--red)}
.empty{text-align:center;color:var(--muted);padding:34px 10px;border:1px dashed var(--line);border-radius:10px}
.note{font-size:.85rem;color:var(--muted);margin-top:12px}
</style>
</head>
<body>
<div class="wrap">
  <header>
    <div><h1>Deadline Desk</h1><p class="sub" id="who">Assignments, deadlines and email reminders.</p></div>
    <button class="btn ghost small" id="out" hidden>Sign out</button>
  </header>

  <div class="panel" id="auth" hidden>
    <h2>Sign in</h2>
    <label for="em">Email (reminders go here)</label><input id="em" type="email" autocomplete="email">
    <label for="pw">Password (6+ characters)</label><input id="pw" type="password" autocomplete="current-password">
    <div class="row"><button class="btn" id="signin">Sign in</button><button class="btn ghost" id="signup">Create account</button></div>
    <p class="msg" id="msg" role="alert"></p>
  </div>

  <div class="grid" id="app" hidden>
    <form class="panel" id="form">
      <h2>Add assignment</h2>
      <label for="title">Title</label><input id="title" required maxlength="120">
      <label for="course">Course</label><input id="course" maxlength="60">
      <label for="due">Due date and time</label><input id="due" type="datetime-local" required>
      <label for="prio">Priority</label>
      <select id="prio"><option>Normal</option><option>High</option><option>Low</option></select>
      <button class="btn full" type="submit">Add assignment</button>
      <p class="note">You’ll get an email 24 hours and 2 hours before each deadline, even when this page is closed.</p>
    </form>
    <main>
      <div class="tabs" role="group" aria-label="Filter">
        <button class="tab" data-f="open" aria-pressed="true">Pending</button>
        <button class="tab" data-f="soon" aria-pressed="false">Due soon</button>
        <button class="tab" data-f="done" aria-pressed="false">Completed</button>
        <button class="tab" data-f="all" aria-pressed="false">All</button>
      </div>
      <div id="list"></div>
    </main>
  </div>
</div>
<script>
var CFG={url:"https://moufsktgzaigsogoovin.supabase.co",key:"sb_publishable_oBUvBh9tnu-uMPKQvE3C8A_gE09kpxc"};
var $=function(i){return document.getElementById(i)}, items=[], filter="open", sb=null;
if(CFG.url.indexOf("YOUR_")===0){document.body.innerHTML='<div class="wrap"><div class="empty">Open index.html and paste your Supabase URL and anon key into CFG at the top of the script.</div></div>'}
else{
sb=supabase.createClient(CFG.url,CFG.key);
function esc(s){var e=document.createElement("div");e.textContent=s;return e.innerHTML}
function fmt(i){return new Date(i).toLocaleString([],{weekday:"short",month:"short",day:"numeric",hour:"numeric",minute:"2-digit"})}
function status(a){if(a.done)return"done";var ms=new Date(a.due)-Date.now();return ms<0?"overdue":ms<=48*36e5?"soon":"ok"}
function rel(a){var ms=new Date(a.due)-Date.now(),x=Math.abs(ms),m=Math.round(x/6e4),h=Math.round(x/36e5),t=m<60?m+" min":h<48?h+" hr":Math.floor(x/864e5)+" days";return ms<0?"Overdue by "+t:"Due in "+t}
function render(){
  var rows=items.filter(function(a){var s=status(a);return filter==="all"||(filter==="open"&&s!=="done")||(filter==="done"&&s==="done")||(filter==="soon"&&(s==="soon"||s==="overdue"))});
  $("list").innerHTML=rows.length?rows.map(function(a){var s=status(a);
    return '<div class="item '+s+'" data-id="'+a.id+'"><input type="checkbox" aria-label="Mark complete" '+(a.done?"checked":"")+'><div class="body"><div class="t">'+esc(a.title)+'</div><div class="meta">'+(a.course?esc(a.course)+" · ":"")+fmt(a.due)+(a.priority!=="Normal"?" · "+esc(a.priority)+" priority":"")+'</div><span class="badge '+s+'">'+(a.done?"Completed":rel(a))+'</span></div><button class="del" aria-label="Delete assignment">×</button></div>'}).join(""):'<div class="empty">'+(items.length?"Nothing in this view.":"No assignments yet. Add your first one.")+'</div>';
}
async function load(){var r=await sb.from("assignments").select("*").order("due");if(r.error){alert(r.error.message);return}items=r.data;render()}
function show(s){
  $("auth").hidden=!!s;$("app").hidden=!s;$("out").hidden=!s;
  $("who").textContent=s?"Reminders go to "+s.user.email:"Assignments, deadlines and email reminders.";
  if(s)load();
}
sb.auth.onAuthStateChange(function(e,s){show(s)});
sb.auth.getSession().then(function(r){show(r.data.session)});
$("signin").onclick=async function(){var r=await sb.auth.signInWithPassword({email:$("em").value,password:$("pw").value});$("msg").textContent=r.error?r.error.message:""};
$("signup").onclick=async function(){var r=await sb.auth.signUp({email:$("em").value,password:$("pw").value});$("msg").textContent=r.error?r.error.message:(r.data.session?"":"Check your inbox to confirm your email, then sign in.")};
$("out").onclick=function(){sb.auth.signOut()};
$("form").onsubmit=async function(e){e.preventDefault();
  var r=await sb.from("assignments").insert({title:$("title").value.trim(),course:$("course").value.trim()||null,due:new Date($("due").value).toISOString(),priority:$("prio").value});
  if(r.error){alert(r.error.message);return}$("title").value="";load()};
$("list").onclick=async function(e){var el=e.target.closest(".item");if(!el)return;var id=el.dataset.id;
  if(e.target.classList.contains("del")){await sb.from("assignments").delete().eq("id",id)}
  else if(e.target.type==="checkbox"){await sb.from("assignments").update({done:e.target.checked}).eq("id",id)}
  else return;load()};
document.querySelectorAll(".tab").forEach(function(b){b.onclick=function(){filter=b.dataset.f;document.querySelectorAll(".tab").forEach(function(x){x.setAttribute("aria-pressed",x===b)});render()}});
setInterval(render,60000);
}
</script>
</body>
</html>
